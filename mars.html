<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mars Bounce It</title>
<style>
  :root{
    --mars-red:#d31f2f;
    --mars-gold:#e0c88a;
    --panel:#111214;
  }
  html,body{
    margin:0;padding:0;height:100%;
    font-family:'Trebuchet MS','Segoe UI',sans-serif;
    background:#000;
    overflow:hidden;
    -webkit-user-select:none;user-select:none;
    touch-action:none;
  }
  #stage{
    position:relative;
    width:420px;
    height:700px;
    margin:10px auto;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,0.7), 0 0 0 5px #1a1a1a, 0 0 0 8px #d31f2f;
    background:#000;
  }
  canvas{ display:block; background:#000; touch-action:none; }
  #hud{
    position:absolute; top:12px; left:0; right:0;
    display:flex; justify-content:space-between; align-items:center;
    padding:0 16px;
    pointer-events:none;
    color:#fff;
  }
  #score{
    font-size:26px; font-weight:800;
    color:#fff;
    text-shadow:0 2px 6px rgba(0,0,0,0.6);
    background:rgba(211,31,47,0.25);
    border:1px solid rgba(224,200,138,0.4);
    padding:3px 16px;
    border-radius:14px;
  }
  #best{
    font-size:12px; font-weight:600;
    color:#e0c88a;
    background:rgba(0,0,0,0.4);
    padding:4px 12px;
    border-radius:12px;
  }
  .overlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    background:radial-gradient(circle at 50% 25%, rgba(40,6,10,0.85), rgba(0,0,0,0.96));
    color:#fff;
    padding:22px;
    box-sizing:border-box;
  }
  .hidden{display:none !important;}
  #mLogo{
    width:200px; max-width:70%; height:auto;
    margin-bottom:2px;
    filter:drop-shadow(0 8px 16px rgba(0,0,0,0.6));
  }
  .gameTitle{
    font-size:30px;
    font-weight:800;
    color:#fff;
    letter-spacing:0.5px;
    margin:6px 0 2px 0;
    text-shadow:0 3px 0 #7a0f18, 0 8px 14px rgba(0,0,0,0.5);
  }
  .gameTitle span{ color:var(--mars-gold); }
  .subtitle{
    font-size:13.5px;
    color:#f1e6d8;
    opacity:0.92;
    margin:10px 0 20px 0;
    line-height:1.6;
    max-width:290px;
  }
  .btn{
    font-family:inherit;
    font-weight:800;
    font-size:17px;
    color:#fff;
    background:linear-gradient(#e5384a, var(--mars-red));
    border:none;
    border-bottom:5px solid #8f101c;
    padding:12px 36px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 6px 16px rgba(211,31,47,0.45);
    transition:transform .08s ease;
  }
  .btn:active{ transform:translateY(3px); border-bottom-width:2px; }
  .scan-again-btn{
    appearance:none;
    -webkit-appearance:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    margin-top:16px;
    min-height:52px;
    min-width:220px;
    padding:14px 36px;
    border:none;
    border-radius:999px;
    font-family:inherit;
    font-size:17px;
    font-weight:800;
    letter-spacing:.04em;
    color:#3c2415;
    background:linear-gradient(#f8ebc8, var(--mars-gold));
    box-shadow:0 8px 22px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.45);
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
  }
  .scan-again-btn:hover{
    filter:brightness(1.06);
    box-shadow:0 10px 26px rgba(0,0,0,.46), inset 0 1px 0 rgba(255,255,255,.55);
  }
  .scan-again-btn:active{
    transform:scale(.97);
    box-shadow:0 4px 12px rgba(0,0,0,.32);
  }
  #finalScore{ font-size:22px; color:#fff; margin:4px 0 2px; font-weight:800;}
  #bestMsg{ font-size:13px; color:var(--mars-gold); margin-bottom:16px; }
  #controlsHint{
    position:absolute; bottom:8px; left:0; right:0; text-align:center;
    font-size:10.5px; color:rgba(255,255,255,0.55); pointer-events:none;
  }
  .goTitle{
    font-size:26px; font-weight:800; color:#fff;
    text-shadow:0 3px 0 #7a0f18;
    margin-bottom:8px;
  }
</style>
</head>

  let barLoaded = false;
  barImg.onload = ()=>{ barLoaded = true; };

  // ---------- skyline (subtle, procedurally drawn silhouette) ----------
  const buildings = [];
  (function buildSkyline(){
    let x = 0;
    while (x < W) {
      const w = 26 + Math.random()*46;
      const h = 60 + Math.random()*220;
      const spire = Math.random() < 0.28;
      buildings.push({ x, w, h, spire, lights: Math.random()<0.5 });
      x += w + Math.random()*6;
    }
  })();

  // ---------- game state ----------
  let bar, ball, running, gameOver, score, best_local;
  let pointerX = null;
  let baseSpeed, speedGrowth;

  function resetGame(){
    bar = {
      w: 118, h: 40, x: W/2 - 59, y: H - 70,
      targetX: W/2 - 59
    };
    baseSpeed = 4.6;
    speedGrowth = 0.055; // per bounce, subtle
    ball = {
      x: W/2, y: H/2, r: 10,
      vx: baseSpeed * (Math.random()<0.5?1:-1) * 0.6,
      vy: -baseSpeed
    };
    running = true;
    gameOver = false;
    score = 0;
    scoreEl.textContent = '0';
  }

  // ---------- input ----------
  function setBarFromClientX(clientX){
    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width;
    const relX = (clientX - rect.left) * scaleX;
    bar.targetX = clamp(relX - bar.w/2, 6, W - bar.w - 6);
  }

  canvas.addEventListener('touchstart', (e)=>{
    if (!running) return;
    const t = e.changedTouches[0];
    setBarFromClientX(t.clientX);
  }, {passive:true});
  canvas.addEventListener('touchmove', (e)=>{
    if (!running) return;
    const t = e.changedTouches[0];
    setBarFromClientX(t.clientX);
    e.preventDefault();
  }, {passive:false});

  canvas.addEventListener('mousedown', (e)=>{
    pointerX = e.clientX;
    if (running) setBarFromClientX(e.clientX);
  });
  window.addEventListener('mousemove', (e)=>{
    if (pointerX===null || !running) return;
    setBarFromClientX(e.clientX);
  });
  window.addEventListener('mouseup', ()=>{ pointerX = null; });

  // keyboard fallback for desktop testing
  const keys = {left:false, right:false};
  window.addEventListener('keydown', (e)=>{
    if (e.key==='ArrowLeft') keys.left = true;
    if (e.key==='ArrowRight') keys.right = true;
  });
  window.addEventListener('keyup', (e)=>{
    if (e.key==='ArrowLeft') keys.left = false;
    if (e.key==='ArrowRight') keys.right = false;
  });

  function clamp(v,a,b){ return Math.max(a, Math.min(b,v)); }

  // ---------- update ----------
  function update(){
    if (!running) return;

    // bar movement toward target (smooth), plus keyboard support
    if (keys.left) bar.targetX -= 7;
    if (keys.right) bar.targetX += 7;
    bar.targetX = clamp(bar.targetX, 6, W - bar.w - 6);
    bar.x += (bar.targetX - bar.x) * 0.35;

    // ball movement
    ball.x += ball.vx;
    ball.y += ball.vy;

    // side walls
    if (ball.x - ball.r < 6) { ball.x = 6 + ball.r; ball.vx *= -1; }
    if (ball.x + ball.r > W - 6) { ball.x = W - 6 - ball.r; ball.vx *= -1; }

    // top wall bounce
    if (ball.y - ball.r < 34) {
      ball.y = 34 + ball.r;
      ball.vy *= -1;
      score += 1;
      scoreEl.textContent = score;
      const speedMult = 1 + speedGrowth * 0.35;
      ball.vx *= speedMult;
      ball.vy *= speedMult;
      capSpeed();
    }

    // bar collision
    if (ball.y + ball.r >= bar.y && ball.y + ball.r <= bar.y + bar.h + 14 && ball.vy > 0) {
      if (ball.x + ball.r > bar.x && ball.x - ball.r < bar.x + bar.w) {
        ball.y = bar.y - ball.r;
        const hitPos = (ball.x - (bar.x + bar.w/2)) / (bar.w/2); // -1..1
        const speed = Math.hypot(ball.vx, ball.vy);
        const newSpeed = speed * (1 + speedGrowth);
        const angle = hitPos * (Math.PI/3.1); // max ~58 degrees
        ball.vx = newSpeed * Math.sin(angle);
        ball.vy = -Math.abs(newSpeed * Math.cos(angle));
        capSpeed();
        score += 1;
        scoreEl.textContent = score;
      }
    }

    // fell below bar = game over
    if (ball.y - ball.r > H) {
      triggerGameOver();
    }
  }

  function capSpeed(){
    const maxSpeed = 15.5;
    const speed = Math.hypot(ball.vx, ball.vy);
    if (speed > maxSpeed) {
      const k = maxSpeed / speed;
      ball.vx *= k; ball.vy *= k;
    }
    const minSpeed = 4.2;
    if (speed < minSpeed) {
      const k = minSpeed / Math.max(speed,0.01);
      ball.vx *= k; ball.vy *= k;
    }
  }

  function triggerGameOver(){
    if (!running) return;
    running = false;
    gameOver = true;
    setTimeout(()=>{
      finalScoreEl.textContent = 'Score: ' + score;
      if (score > best) {
        best = score;
        try{ localStorage.setItem('marsBounceBest', String(best)); }catch(e){}
        bestMsgEl.textContent = '🏆 New Best Score!';
      } else {
        bestMsgEl.textContent = 'Best: ' + best;
      }
      bestEl.textContent = 'BEST ' + best;
      gameOverScreen.classList.remove('hidden');
    }, 400);
  }

  // ---------- drawing ----------
  function drawBackground(){
    ctx.fillStyle = '#000';
    ctx.fillRect(0,0,W,H);

    // subtle deep-red horizon glow near top wall area, very dim
    const grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,'rgba(90,10,20,0.10)');
    grad.addColorStop(0.35,'rgba(20,4,10,0.04)');
    grad.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);

    // faint stars
    ctx.save();
    for (let i=0;i<40;i++){
      const sx = (i*97) % W;
      const sy = (i*53) % (H*0.55);
      const tw = 0.25 + ((i*37)%10)/20;
      ctx.globalAlpha = 0.15 + tw*0.2;
      ctx.fillStyle = '#fff';
      ctx.fillRect(sx, sy, 1.4, 1.4);
    }
    ctx.restore();

    // subtle Dubai-style skyline silhouette along the bottom, very dim so it never
    // gets confused with the ball or bar
    ctx.save();
    ctx.globalAlpha = 0.16;
    ctx.fillStyle = '#3a1218';
    for (const b of buildings){
      const by = H - b.h;
      ctx.fillRect(b.x, by, b.w, b.h + 40);
      if (b.spire){
        ctx.beginPath();
        ctx.moveTo(b.x + b.w*0.5 - 1.5, by - 22);
        ctx.lineTo(b.x + b.w*0.5 + 1.5, by - 22);
        ctx.lineTo(b.x + b.w*0.5, by - 46);
        ctx.closePath();
        ctx.fill();
      }
    }
    ctx.globalAlpha = 0.10;
    ctx.fillStyle = '#e0c88a';
    for (const b of buildings){
      if (!b.lights) continue;
      const by = H - b.h;
      for (let wy = by+10; wy < H-6; wy += 14){
        for (let wx = b.x+4; wx < b.x+b.w-4; wx += 9){
          if ((Math.floor(wx+wy))%3===0) ctx.fillRect(wx, wy, 2, 2);
        }
      }
    }
    ctx.restore();
  }

  function drawWall(){
    // top wall — the single "opponent" wall
    ctx.save();
    ctx.fillStyle = '#d31f2f';
    ctx.fillRect(0, 22, W, 10);
    ctx.fillStyle = 'rgba(224,200,138,0.55)';
    ctx.fillRect(0, 32, W, 1.5);
    // little tick marks
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    for (let x=8; x<W-8; x+=18){
      ctx.fillRect(x, 24, 6, 6);
    }
    ctx.restore();
  }

  function drawBar(){
    ctx.save();
    if (barLoaded) {
      // subtle glow shadow
      ctx.save();
      ctx.shadowColor = 'rgba(211,31,47,0.55)';
      ctx.shadowBlur = 14;
      ctx.drawImage(barImg, bar.x, bar.y, bar.w, bar.h);
      ctx.restore();
    } else {
      ctx.fillStyle = '#1a1a1a';
      roundRect(ctx, bar.x, bar.y, bar.w, bar.h, 8);
      ctx.fill();
      ctx.fillStyle = '#d31f2f';
      ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Mars', bar.x + bar.w/2, bar.y + bar.h/2 + 6);
    }
    ctx.restore();
  }

  function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function drawBall(){
    ctx.save();
    const grad = ctx.createRadialGradient(ball.x-3, ball.y-3, 1, ball.x, ball.y, ball.r);
    grad.addColorStop(0, '#fff7e6');
    grad.addColorStop(0.55, '#f4c430');
    grad.addColorStop(1, '#c98a12');
    ctx.fillStyle = grad;
    ctx.shadowColor = 'rgba(244,196,48,0.65)';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  function draw(){
    drawBackground();
    drawWall();
    drawBar();
    drawBall();
  }

  function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
  }

  // ---------- flow ----------
  startBtn.addEventListener('click', ()=>{
    startScreen.classList.add('hidden');
    resetGame();
  });
  retryBtn.addEventListener('click', ()=>{
    gameOverScreen.classList.add('hidden');
    resetGame();
  });
  document.getElementById('close-game-btn').addEventListener('click', function() {
      if (window.parent) {
          window.parent.postMessage({ action: 'resetGame' }, '*');
      }
  });

  resetGame();
  running = false;
  draw();

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
