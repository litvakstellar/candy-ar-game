<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bounty Jump — Paradise Escape</title>
<style>
  :root{
    --sky-top:#7fd8e8;
    --sky-mid:#a3e8d0;
    --sky-bottom:#ffe9a8;
    --sand:#f6d98b;
    --coconut:#7a4a2b;
    --coconut-dark:#5c3720;
    --leaf:#2f9e6e;
    --leaf-dark:#1f7a52;
    --wrapper-blue:#1f6fb2;
    --wrapper-white:#f5f2e6;
    --bounty-brown:#3c2415;
    --danger:#e8483c;
    --panel:#0f3d3a;
  }
  html,body{
    margin:0;padding:0;height:100%;
    font-family:'Baloo 2','Trebuchet MS',sans-serif;
    background:#04201f;
    overflow:hidden;
    -webkit-user-select:none;user-select:none;
  }
  @font-face{
    font-family:'Baloo 2';
    src:local('Baloo 2');
  }
  #stage{
    position:relative;
    width:420px;
    height:680px;
    margin:12px auto;
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,0.55), 0 0 0 6px #0a2b29, 0 0 0 10px #d9b45c;
  }
  canvas{
    display:block;
    background:linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-mid) 45%, var(--sky-bottom) 100%);
  }
  #hud{
    position:absolute; top:10px; left:0; right:0;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:0 14px;
    pointer-events:none;
    font-weight:800;
    color:#fff;
    text-shadow:0 2px 4px rgba(0,0,0,0.35);
  }
  #score{
    font-size:26px;
    background:rgba(15,61,58,0.55);
    padding:4px 14px;
    border-radius:14px;
    backdrop-filter:blur(2px);
  }
  #best{
    font-size:13px;
    background:rgba(15,61,58,0.55);
    padding:4px 12px;
    border-radius:12px;
    margin-top:4px;
  }
  #bounty-count{
    font-size:15px;
    background:rgba(15,61,58,0.55);
    padding:6px 12px;
    border-radius:14px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .overlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    background:radial-gradient(circle at 50% 30%, rgba(10,60,58,0.72), rgba(4,25,24,0.92));
    color:#fff;
    padding:24px;
    box-sizing:border-box;
  }
  .hidden{display:none !important;}
  .title{
    font-size:38px;
    font-weight:800;
    color:#ffe9a8;
    text-shadow:0 4px 0 #3c2415, 0 8px 14px rgba(0,0,0,0.4);
    letter-spacing:1px;
    margin:0 0 4px 0;
  }
  .subtitle{
    font-size:14px;
    color:#eafff6;
    opacity:0.9;
    margin-bottom:18px;
    line-height:1.5;
    max-width:280px;
  }
  .btn{
    font-family:inherit;
    font-weight:800;
    font-size:18px;
    color:#3c2415;
    background:linear-gradient(#ffe9a8,#f4cf6e);
    border:none;
    border-bottom:5px solid #c99a3c;
    padding:12px 34px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 6px 14px rgba(0,0,0,0.35);
    transition:transform .08s ease;
  }
  .btn:active{ transform:translateY(3px); border-bottom-width:2px; }
  .scan-again-btn{
    appearance:none;
    -webkit-appearance:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    margin-top:16px;
    min-height:52px;
    min-width:220px;
    padding:14px 36px;
    border:none;
    border-radius:999px;
    font-family:inherit;
    font-size:17px;
    font-weight:800;
    letter-spacing:.04em;
    color:#0f3d3a;
    background:linear-gradient(#fff8e6,#ffe9a8);
    box-shadow:0 8px 22px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.55);
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
  }
  .scan-again-btn:hover{
    filter:brightness(1.05);
    box-shadow:0 10px 26px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.65);
  }
  .scan-again-btn:active{
    transform:scale(.97);
    box-shadow:0 4px 12px rgba(0,0,0,.28);
  }
  .legend{
    display:flex; gap:16px; margin-top:22px; font-size:11px; color:#eafff6;
    flex-wrap:wrap; justify-content:center; max-width:300px;
  }
  .legend span{ display:flex; align-items:center; gap:5px; }
  .legend b{ font-size:16px; }
  #finalScore{ font-size:20px; color:#fff; margin:6px 0 2px; font-weight:700;}
  #controlsHint{
    position:absolute; bottom:10px; left:0; right:0; text-align:center;
    font-size:11px; color:rgba(255,255,255,0.75); pointer-events:none;
  }
</style>
</head>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const bountyNumEl = document.getElementById('bountyNum');
  const startScreen = document.getElementById('startScreen');
  const gameOverScreen = document.getElementById('gameOverScreen');
  const finalScoreEl = document.getElementById('finalScore');
  const bestMsgEl = document.getElementById('bestMsg');
  const startBtn = document.getElementById('startBtn');
  const retryBtn = document.getElementById('retryBtn');

  let best = 0;
  try { best = parseInt(localStorage.getItem('bountyJumpBest')||'0',10) || 0; } catch(e){ best = 0; }
  bestEl.textContent = 'BEST ' + best;

  // ---------- world state ----------
  let player, platforms, hazards, particles, palmBg, cloudBg;
  let camY, score, bountyCount, gravity, running, keys, gameOver;
  let spawnCursorY;
  let shakeT = 0;
  let lastPlatformType = null;

  function rand(a,b){ return a + Math.random()*(b-a); }
  function chance(p){ return Math.random() < p; }

  function resetGame(){
    player = {
      x: W/2 - 20, y: H - 160, w: 40, h: 52,
      vx: 0, vy: 0, facing: 1, squash: 1, alive: true,
      trail: []
    };
    gravity = 0.42;
    platforms = [];
    hazards = [];
    particles = [];
    camY = 0;
    score = 0;
    bountyCount = 0;
    running = true;
    gameOver = false;
    keys = {left:false, right:false};
    spawnCursorY = H - 40;

    // starting platform right under player
    platforms.push(makePlatform(W/2 - 34, H - 90, 'normal'));
    let y = H - 90;
    while (y > -H) {
      y -= rand(58, 92);
      platforms.push(spawnPlatformAt(y));
    }
    spawnCursorY = y;

    // decorative background elements
    palmBg = [];
    for (let i=0;i<6;i++){
      palmBg.push({ x: rand(0,W), y: rand(0,H*3), s: rand(0.6,1.2) });
    }
    cloudBg = [];
    for (let i=0;i<10;i++){
      cloudBg.push({ x: rand(0,W), y: rand(0,H*3), s: rand(0.5,1.3), speed: rand(0.05,0.15) });
    }

    player.vy = -9.9; // 10% slower initial jump
  }

  function makePlatform(x,y,type){
    return {
      x, y, w: 66, h: 16, type,
      vx: type==='moving' ? rand(0.8,1.6)*(chance(0.5)?1:-1) : 0,
      broke: false,
      phase: rand(0, Math.PI*2)
    };
  }

  function spawnPlatformAt(y){
    const x = rand(20, W-20-66);
    let type = 'normal';
    const r = Math.random();
    // distance actually climbed from the starting platform (monotonic, unlike raw y)
    const climbed = (H - 90) - y;
    // score is roughly floor(camY/10) and climbed tracks camY at spawn time,
    // so climbed < 100 corresponds to the player's first ~10 points of score.
    const SAFE_ZONE_CLIMB = 100;
    if (r < 0.12) type = 'moving';
    else if (r < 0.20 && climbed > 400) type = 'crumble';
    else if (r < 0.26 && climbed > 900) type = 'cloud'; // small platform
    const p = makePlatform(x,y,type);

    // occasionally add hazard near / on platform (never during the first 10 points)
    if (chance(0.22) && climbed > SAFE_ZONE_CLIMB) {
      const hazType = ['bomb','poison','snake'][Math.floor(Math.random()*3)];
      const hx = clamp(x + rand(-30,30), 10, W-40);
      hazards.push({ x: hx, y: y - rand(30,55), w: 30, h: 30, type: hazType, phase: rand(0,10), vx: hazType==='snake'?rand(0.4,0.8)*(chance(0.5)?1:-1):0 });
    }
    // occasionally add bounty bar collectible floating
    if (chance(0.16)) {
      const hx = clamp(x + rand(-20,20), 10, W-40);
      hazards.push({ x: hx, y: y - rand(40,70), w: 26, h: 26, type: 'bounty', phase: rand(0,10) });
    }
    return p;
  }

  function clamp(v,a,b){ return Math.max(a, Math.min(b,v)); }

  // ---------- input ----------
  window.addEventListener('keydown', (e)=>{
    if (e.key==='ArrowLeft' || e.key==='a' || e.key==='A') keys.left = true;
    if (e.key==='ArrowRight' || e.key==='d' || e.key==='D') keys.right = true;
  });
  window.addEventListener('keyup', (e)=>{
    if (e.key==='ArrowLeft' || e.key==='a' || e.key==='A') keys.left = false;
    if (e.key==='ArrowRight' || e.key==='d' || e.key==='D') keys.right = false;
  });

  // touch: tap left/right half of stage
  canvas.addEventListener('touchstart', (e)=>{
    const rect = canvas.getBoundingClientRect();
    for (const t of e.changedTouches){
      const relX = (t.clientX - rect.left) / rect.width * W;
      if (relX < W/2) keys.left = true; else keys.right = true;
    }
  }, {passive:true});
  canvas.addEventListener('touchend', (e)=>{
    keys.left = false; keys.right = false;
  }, {passive:true});

  // device tilt
  window.addEventListener('deviceorientation', (e)=>{
    if (e.gamma == null || !running) return;
    if (e.gamma < -6) { keys.left = true; keys.right = false; }
    else if (e.gamma > 6) { keys.right = true; keys.left = false; }
    else { keys.left = false; keys.right = false; }
  });

  // ---------- update ----------
  function update(){
    if (!running) return;

    // horizontal movement
    const accel = 0.9, maxV = 5.4, friction = 0.88;
    if (keys.left) player.vx -= accel;
    if (keys.right) player.vx += accel;
    if (!keys.left && !keys.right) player.vx *= friction;
    player.vx = clamp(player.vx, -maxV, maxV);
    if (Math.abs(player.vx) > 0.15) player.facing = player.vx > 0 ? 1 : -1;

    player.x += player.vx;
    // wrap around edges
    if (player.x + player.w < 0) player.x = W;
    if (player.x > W) player.x = -player.w;

    // gravity
    player.vy += gravity;
    player.y += player.vy;

    // squash/stretch
    player.squash += ( (player.vy < -2 ? 1.15 : player.vy > 6 ? 0.85 : 1) - player.squash) * 0.2;

    // camera follows upward movement
    const followLine = H * 0.42;
    if (player.y < followLine) {
      const dy = followLine - player.y;
      camY += dy;
      player.y = followLine;
      for (const p of platforms) p.y += dy;
      for (const h of hazards) h.y += dy;
      for (const pt of palmBg) pt.y += dy*0.55;
      for (const c of cloudBg) c.y += dy*0.25;
      spawnCursorY += dy;
      score = Math.max(score, Math.floor(camY/10));
    }

    // platform physics
    for (const p of platforms) {
      if (p.type==='moving') {
        p.x += p.vx;
        if (p.x < 10 || p.x + p.w > W-10) p.vx *= -1;
      }
      if (p.type==='cloud') {
        p.x += Math.sin((camY+p.phase*40)*0.01)*0.4;
      }
    }

    // collision with platforms (only when falling)
    if (player.vy > 0) {
      for (const p of platforms) {
        if (p.broke) continue;
        const px = player.x + player.w*0.2, pw = player.w*0.6;
        const feetY = player.y + player.h;
        if (px + pw > p.x && px < p.x + p.w &&
            feetY > p.y && feetY < p.y + p.h + player.vy) {
          if (p.type === 'crumble') {
            p.broke = true;
            spawnCrumbleParticles(p);
          } else {
            player.vy = -10.98; // 10% slower bounce
            spawnDust(player.x+player.w/2, player.y+player.h);
          }
        }
      }
    }

    // hazards
    for (const h of hazards) {
      h.phase += 0.05;
      if (h.type==='snake') {
        h.x += h.vx;
        if (h.x < 6 || h.x + h.w > W-6) h.vx *= -1;
      }
      if (h.type==='bounty' || h.type==='poison') {
        h.bob = Math.sin(h.phase)*4;
      }
    }
    // collisions with hazards
    for (let i=hazards.length-1;i>=0;i--){
      const h = hazards[i];
      const hy = h.y + (h.bob||0);
      if (rectOverlap(player.x+8, player.y+8, player.w-16, player.h-16, h.x, hy, h.w, h.h)) {
        if (h.type==='bounty') {
          score += 25;
          bountyCount++;
          bountyNumEl.textContent = bountyCount;
          spawnSparkle(h.x+h.w/2, hy+h.h/2);
          hazards.splice(i,1);
        } else {
          triggerGameOver(h.type);
        }
      }
    }

    // cull off-screen platforms/hazards, spawn new ones above
    platforms = platforms.filter(p => p.y < H + 60);
    hazards = hazards.filter(h => h.y < H + 60);

    while (spawnCursorY > -H*1.4) {
      spawnCursorY -= rand(58,92);
      platforms.push(spawnPlatformAt(spawnCursorY));
    }

    // particles
    for (let i=particles.length-1;i>=0;i--){
      const pt = particles[i];
      pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.15; pt.life -= 1;
      if (pt.life<=0) particles.splice(i,1);
    }

    // fall off bottom = death
    if (player.y > H + 40) {
      triggerGameOver('fall');
    }

    scoreEl.textContent = score;
    if (shakeT>0) shakeT -= 1;
  }

  function rectOverlap(ax,ay,aw,ah,bx,by,bw,bh){
    return ax < bx+bw && ax+aw > bx && ay < by+bh && ay+ah > by;
  }

  function spawnDust(x,y){
    for (let i=0;i<6;i++){
      particles.push({x, y, vx: rand(-1.5,1.5), vy: rand(-2,-0.4), life: 20+Math.random()*10, color:'rgba(255,255,255,0.8)', r: rand(2,4)});
    }
  }
  function spawnCrumbleParticles(p){
    for (let i=0;i<8;i++){
      particles.push({x: p.x+p.w/2, y: p.y+p.h/2, vx: rand(-2,2), vy: rand(-3,-0.5), life: 30, color:'#7a4a2b', r: rand(2,4)});
    }
  }
  function spawnSparkle(x,y){
    for (let i=0;i<10;i++){
      particles.push({x, y, vx: rand(-2.2,2.2), vy: rand(-2.5,-0.5), life: 26, color:'#ffe9a8', r: rand(1.5,3.5)});
    }
  }

  function triggerGameOver(cause){
    if (!running) return;
    running = false;
    gameOver = true;
    shakeT = 14;
    for (let i=0;i<18;i++){
      particles.push({x: player.x+player.w/2, y: player.y+player.h/2, vx: rand(-3,3), vy: rand(-4,-0.5), life: 40, color: cause==='bomb'?'#e8483c':cause==='poison'?'#7ed957':'#c99a3c', r: rand(2,5)});
    }
    setTimeout(()=>{
      finalScoreEl.textContent = 'Score: ' + score + '   🍫 x' + bountyCount;
      if (score > best) {
        best = score;
        try{ localStorage.setItem('bountyJumpBest', String(best)); }catch(e){}
        bestMsgEl.textContent = '🏆 New Best Score!';
      } else {
        bestMsgEl.textContent = 'Best: ' + best;
      }
      bestEl.textContent = 'BEST ' + best;
      gameOverScreen.classList.remove('hidden');
    }, 550);
  }

  // ---------- drawing ----------
  function drawBackground(){
    // sky gradient handled by CSS background; add sun + clouds + distant palms
    // sun
    ctx.save();
    const sunY = 90 - (camY*0.05) % 900;
    ctx.beginPath();
    ctx.fillStyle = 'rgba(255,244,200,0.9)';
    ctx.arc(70, ((sunY%900)+900)%900 - 100, 46, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();

    // clouds
    for (const c of cloudBg){
      const cy = ((c.y % (H*3)) + H*3) % (H*3) - H;
      drawCloud(c.x, cy, c.s);
    }
    // distant palms silhouettes near edges
    for (const p of palmBg){
      const py = ((p.y % (H*3)) + H*3) % (H*3) - H;
      drawPalmSilhouette(p.x < W/2 ? 8 : W-8, py, p.s, p.x < W/2 ? 1 : -1);
    }
  }

  function drawCloud(x,y,s){
    ctx.save();
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.ellipse(x, y, 26*s, 12*s, 0, 0, Math.PI*2);
    ctx.ellipse(x+18*s, y+4*s, 18*s, 10*s, 0, 0, Math.PI*2);
    ctx.ellipse(x-18*s, y+4*s, 18*s, 10*s, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  function drawPalmSilhouette(x,y,s,dir){
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = '#1f7a52';
    ctx.lineWidth = 6*s;
    ctx.beginPath();
    ctx.moveTo(x,y+60*s);
    ctx.quadraticCurveTo(x+10*dir*s, y+20*s, x+4*dir*s, y);
    ctx.stroke();
    ctx.fillStyle = '#2f9e6e';
    for (let i=0;i<5;i++){
      const ang = (i/5)*Math.PI*1.4 - 0.7 + (dir<0?Math.PI:0);
      ctx.beginPath();
      ctx.ellipse(x+4*dir*s + Math.cos(ang)*18*s, y+Math.sin(ang)*10*s, 16*s, 6*s, ang, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawPlatform(p){
    ctx.save();
    ctx.translate(p.x, p.y);
    if (p.type==='crumble' && p.broke) { ctx.restore(); return; }

    let topColor = '#e8c76b', sideColor = '#c99a3c', plankColor='#a97a3a';
    if (p.type==='moving') { topColor='#7fe0c9'; sideColor='#3fae95'; }
    if (p.type==='crumble') { topColor='#d99b6c'; sideColor='#a9633a'; }
    if (p.type==='cloud') { topColor='#ffffff'; sideColor='#dfeef0'; }

    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.beginPath();
    ctx.ellipse(p.w/2, p.h+6, p.w/2-4, 5, 0, 0, Math.PI*2);
    ctx.fill();

    if (p.type==='cloud') {
      ctx.fillStyle = topColor;
      ctx.beginPath();
      ctx.ellipse(p.w/2, p.h/2, p.w/2, p.h/1.4, 0,0,Math.PI*2);
      ctx.ellipse(p.w/2-18, p.h/2+2, p.w/3.2, p.h/1.6, 0,0,Math.PI*2);
      ctx.ellipse(p.w/2+18, p.h/2+2, p.w/3.2, p.h/1.6, 0,0,Math.PI*2);
      ctx.fill();
    } else {
      // wood plank platform (bamboo raft style)
      ctx.fillStyle = sideColor;
      roundRect(ctx, 0, 4, p.w, p.h, 8);
      ctx.fill();
      ctx.fillStyle = topColor;
      roundRect(ctx, 0, 0, p.w, p.h, 8);
      ctx.fill();
      // plank lines
      ctx.strokeStyle = 'rgba(0,0,0,0.15)';
      ctx.lineWidth = 1.5;
      for (let i=1;i<4;i++){
        ctx.beginPath();
        ctx.moveTo(i*p.w/4, 2);
        ctx.lineTo(i*p.w/4, p.h-2);
        ctx.stroke();
      }
      if (p.type==='moving'){
        ctx.fillStyle='rgba(255,255,255,0.5)';
        ctx.beginPath(); ctx.arc(p.w/2, p.h/2, 3, 0, Math.PI*2); ctx.fill();
      }
    }
    ctx.restore();
  }

  function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function drawHazard(h){
    const y = h.y + (h.bob||0);
    ctx.save();
    ctx.translate(h.x, y);
    if (h.type==='bomb') drawBomb();
    else if (h.type==='poison') drawPoison();
    else if (h.type==='snake') drawSnake(h);
    else if (h.type==='bounty') drawBounty();
    ctx.restore();
  }

  function drawBomb(){
    ctx.fillStyle='rgba(0,0,0,0.15)';
    ctx.beginPath(); ctx.ellipse(15,28,12,4,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#2b2b2b';
    ctx.beginPath(); ctx.arc(15,17,13,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.25)';
    ctx.beginPath(); ctx.arc(10,12,4,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#6b4423'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(15,5); ctx.quadraticCurveTo(22,-4,26,2); ctx.stroke();
    ctx.fillStyle='#ff7a3c';
    ctx.beginPath(); ctx.arc(26,1,3.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ffd23c';
    ctx.beginPath(); ctx.arc(26,1,1.8,0,Math.PI*2); ctx.fill();
  }

  function drawPoison(){
    ctx.fillStyle='rgba(0,0,0,0.15)';
    ctx.beginPath(); ctx.ellipse(13,27,11,4,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#3a7a3a';
    roundRect(ctx,4,6,18,20,4); ctx.fill();
    ctx.fillStyle='#245c24';
    roundRect(ctx,7,0,12,8,2); ctx.fill();
    ctx.fillStyle='#eafbe0';
    ctx.beginPath(); ctx.ellipse(13,17,7,7,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#2b2b2b';
    ctx.beginPath(); ctx.moveTo(9,13); ctx.lineTo(13,18); ctx.lineTo(9,21); ctx.stroke();
    ctx.font='bold 10px sans-serif'; ctx.fillStyle='#2b2b2b'; ctx.textAlign='center';
    ctx.fillText('☠', 13, 21);
  }

  function drawSnake(h){
    ctx.strokeStyle = '#4a9e4a';
    ctx.lineWidth = 7;
    ctx.lineCap='round';
    const dir = h.vx>=0?1:-1;
    ctx.beginPath();
    ctx.moveTo(0,15);
    ctx.quadraticCurveTo(8*dir, 6+Math.sin(h.phase)*4, 16*dir, 15);
    ctx.quadraticCurveTo(24*dir, 24-Math.sin(h.phase)*4, 30*dir, 15);
    ctx.stroke();
    ctx.fillStyle='#4a9e4a';
    ctx.beginPath();
    ctx.arc(30*dir,15,6,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(30*dir+2*dir,13,1.6,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#c92e2e';
    ctx.beginPath(); ctx.moveTo(30*dir+5*dir,15); ctx.lineTo(30*dir+9*dir,13); ctx.lineTo(30*dir+9*dir,17); ctx.fill();
  }

  function drawBounty(){
    // little bounty chocolate bar with blue wrapper
    ctx.save();
    ctx.translate(0,0);
    ctx.fillStyle='rgba(0,0,0,0.15)';
    ctx.beginPath(); ctx.ellipse(13,26,11,4,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1f6fb2';
    roundRect(ctx,2,4,22,18,4); ctx.fill();
    ctx.fillStyle = '#f5f2e6';
    roundRect(ctx,5,7,16,5,2); ctx.fill();
    ctx.fillStyle = '#1f6fb2';
    ctx.font = 'bold 6px sans-serif';
    ctx.textAlign='center';
    ctx.fillText('BOUNTY', 13, 11);
    ctx.fillStyle='#3c2415';
    roundRect(ctx,6,14,14,6,1.5); ctx.fill();
    ctx.restore();
  }

  function drawPlayer(){
    ctx.save();
    const cx = player.x + player.w/2;
    const cy = player.y + player.h/2;
    ctx.translate(cx, cy);
    ctx.scale(player.facing * 1, player.squash);
    ctx.translate(-player.w/2, -player.h/2);

    // shadow under character
    ctx.save();
    ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle='rgba(0,0,0,0.18)';
    ctx.beginPath();
    ctx.ellipse(cx, player.y+player.h+6, 16, 5, 0,0,Math.PI*2);
    ctx.fill();
    ctx.restore();

    // legs
    ctx.fillStyle = '#f4b93c'; // yellow shorts
    roundRect(ctx, 6, 34, 10, 14, 3); ctx.fill();
    roundRect(ctx, 24, 34, 10, 14, 3); ctx.fill();
    ctx.fillStyle = '#e6a832';
    roundRect(ctx, 6, 44, 10, 6, 2); ctx.fill();
    roundRect(ctx, 24, 44, 10, 6, 2); ctx.fill();
    // sandals
    ctx.fillStyle='#2f8fd1';
    roundRect(ctx,4,48,14,4,2); ctx.fill();
    roundRect(ctx,22,48,14,4,2); ctx.fill();

    // torso - blue shirt
    ctx.fillStyle = '#3fb6e0';
    roundRect(ctx, 4, 14, 32, 24, 8); ctx.fill();
    ctx.fillStyle='#2f9fca';
    roundRect(ctx, 4, 30, 32, 8, 6); ctx.fill();

    // arms
    ctx.fillStyle = '#f4c89a';
    roundRect(ctx, -2, 18, 8, 16, 4); ctx.fill();
    roundRect(ctx, 34, 18, 8, 16, 4); ctx.fill();

    // head
    ctx.fillStyle = '#f7d2a6';
    ctx.beginPath();
    ctx.ellipse(20, 4, 15, 15, 0, 0, Math.PI*2);
    ctx.fill();

    // ears
    ctx.fillStyle='#f4c89a';
    ctx.beginPath(); ctx.ellipse(5,4,3,4,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(35,4,3,4,0,0,Math.PI*2); ctx.fill();

    // hair
    ctx.fillStyle = '#4a2418';
    ctx.beginPath();
    ctx.moveTo(4,0);
    ctx.quadraticCurveTo(6,-16,20,-14);
    ctx.quadraticCurveTo(34,-16,36,0);
    ctx.quadraticCurveTo(30,-6,24,-8);
    ctx.quadraticCurveTo(20,-14,16,-8);
    ctx.quadraticCurveTo(10,-6,4,0);
    ctx.fill();
    // little spike
    ctx.beginPath();
    ctx.moveTo(17,-13); ctx.lineTo(19,-20); ctx.lineTo(22,-13);
    ctx.fill();

    // face - eyebrows
    ctx.strokeStyle='#4a2418'; ctx.lineWidth=2; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(11,-1); ctx.lineTo(17,-2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(23,-2); ctx.lineTo(29,-1); ctx.stroke();

    // eyes (happy closed arcs)
    ctx.beginPath(); ctx.arc(14,3,3,Math.PI*0.15,Math.PI*0.85); ctx.stroke();
    ctx.beginPath(); ctx.arc(26,3,3,Math.PI*0.15,Math.PI*0.85); ctx.stroke();

    // smile
    ctx.beginPath();
    ctx.arc(20,7,8,0.15*Math.PI,0.85*Math.PI);
    ctx.fillStyle='#7a2e1e';
    ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath();
    ctx.arc(20,7,6.4,0.2*Math.PI,0.8*Math.PI);
    ctx.fill();

    ctx.restore();
  }

  function drawParticles(){
    for (const p of particles){
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life/30);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.save();
    if (shakeT>0){
      ctx.translate(rand(-4,4), rand(-4,4));
    }
    drawBackground();
    for (const p of platforms) drawPlatform(p);
    for (const h of hazards) drawHazard(h);
    if (player) drawPlayer();
    drawParticles();
    ctx.restore();
  }

  function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
  }

  // ---------- flow ----------
  startBtn.addEventListener('click', ()=>{
    startScreen.classList.add('hidden');
    resetGame();
  });
  retryBtn.addEventListener('click', ()=>{
    gameOverScreen.classList.add('hidden');
    resetGame();
  });
  document.getElementById('close-game-btn').addEventListener('click', function() {
      if (window.parent) {
          window.parent.postMessage({ action: 'resetGame' }, '*');
      }
  });

  // idle background preview before start
  resetGame();
  running = false;
  draw();

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
