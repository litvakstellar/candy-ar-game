<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Mars AR Candy Selector</title>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js"></script>

  <style>
    :root {
      --bg: #0a0a12;
      --text: #f5f5f7;
      --muted: rgba(255, 255, 255, 0.72);
      --accent: #ff3b30;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      user-select: none;
    }

    #app { position: fixed; inset: 0; }

    #camera-wrap {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 0;
    }

    #webcam { width: 100%; height: 100%; object-fit: cover; }
    #predict-canvas { display: none; }

    #camera-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(0, 0, 0, 0.35) 0%,
        rgba(0, 0, 0, 0.05) 35%,
        rgba(0, 0, 0, 0.05) 55%,
        rgba(0, 0, 0, 0.72) 100%
      );
      pointer-events: none;
    }

    #scanner-ui {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: 0 28px calc(42px + var(--safe-bottom));
      text-align: center;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    #scanner-ui.hidden {
      opacity: 0;
      visibility: hidden;
    }

    #status-title {
      font-size: clamp(26px, 6.5vw, 38px);
      font-weight: 800;
      line-height: 1.12;
      color: #ffffff;
      max-width: 340px;
      text-shadow: 0 3px 24px rgba(0, 0, 0, 0.65);
      letter-spacing: -0.01em;
    }

    #status-title.detected {
      font-size: clamp(34px, 9.5vw, 56px);
      font-weight: 900;
      letter-spacing: -0.02em;
      animation: detectPop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes detectPop {
      from { transform: scale(0.88); opacity: 0.6; }
      to { transform: scale(1); opacity: 1; }
    }

    #status-subtitle {
      margin-top: 12px;
      font-size: clamp(14px, 3.8vw, 17px);
      font-weight: 500;
      line-height: 1.45;
      color: var(--muted);
      max-width: 320px;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.55);
    }

    /* ── Game overlay (full-screen iframe) ── */
    #game-overlay {
      position: absolute;
      inset: 0;
      z-index: 40;
      display: none;
      background: #000;
    }

    #game-overlay.active { display: block; }

    #game-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      -webkit-overflow-scrolling: touch;
    }


    /* ── Start screen ── */
    #start-screen {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(10, 10, 18, 0.92);
      backdrop-filter: blur(20px);
      padding: 32px 24px;
      text-align: center;
      transition: opacity 0.5s, visibility 0.5s;
    }

    #start-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    #start-screen h1 {
      font-size: clamp(28px, 8vw, 42px);
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #ff3b30, #ff9500, #ffcc00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    #start-screen p { color: var(--muted); font-size: 15px; line-height: 1.5; max-width: 320px; margin-bottom: 28px; }

    .btn-primary {
      background: linear-gradient(135deg, #ff3b30, #ff6b35);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 16px 40px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(255, 59, 48, 0.4);
      min-height: 52px;
      min-width: 200px;
    }

    .btn-primary:active { transform: scale(0.96); }

    .demo-toggle {
      margin-top: 16px;
      font-size: 13px;
      color: var(--muted);
      background: none;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 10px 18px;
      cursor: pointer;
    }

    #loading {
      position: absolute;
      inset: 0;
      z-index: 50;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(10, 10, 18, 0.85);
      gap: 16px;
    }

    #loading.visible { display: flex; }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #demo-picker {
      display: none;
      position: absolute;
      bottom: calc(140px + var(--safe-bottom));
      left: 16px;
      right: 16px;
      z-index: 15;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 12px;
      gap: 8px;
      pointer-events: auto;
    }

    #demo-picker.visible { display: flex; flex-wrap: wrap; justify-content: center; }

    .demo-btn {
      flex: 1 1 40%;
      min-width: 120px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="camera-wrap">
      <video id="webcam" autoplay playsinline muted></video>
      <canvas id="predict-canvas" width="640" height="480" aria-hidden="true"></canvas>
      <div id="camera-overlay"></div>
    </div>

    <div id="scanner-ui">
      <div id="status-title">Point at a product</div>
      <div id="status-subtitle">Hold M&amp;Ms, Bounty, or Mars in front of the camera to unlock a game</div>
    </div>

    <div id="game-overlay">
      <iframe id="game-iframe" allow="autoplay; fullscreen" allowfullscreen></iframe>
    </div>


    <div id="demo-picker">
      <button class="demo-btn" data-class="M&Ms">🟡 M&amp;Ms</button>
      <button class="demo-btn" data-class="Bounty">🥥 Bounty</button>
      <button class="demo-btn" data-class="Mars">🍫 Mars</button>
      <button class="demo-btn" data-class="Other">⬜ Other</button>
    </div>

    <div id="loading">
      <div class="spinner"></div>
      <div id="loading-text">Loading model…</div>
    </div>

    <div id="start-screen">
      <h1>Candy Selector</h1>
      <p>Scan Mars candy products to unlock brand mini-games.</p>
      <button class="btn-primary" id="start-btn" type="button">Start Camera</button>
      <button class="demo-toggle" id="demo-toggle" type="button">Enable Demo Mode</button>
    </div>
  </div>

  <script>
    const CONFIG = {
      MODEL_URL: 'https://teachablemachine.withgoogle.com/models/c_gOK8GJo/',
      CONFIDENCE_THRESHOLD: 0.85,
      DETECTION_INTERVAL_MS: 200,
      TRIGGER_HOLD_MS: 1000,
      CLASSES: ['M&Ms', 'Bounty', 'Mars', 'Other'],
      CANDY_CLASSES: ['M&Ms', 'Bounty', 'Mars'],
      BRAND_INFO: {
        'M&Ms':  { gameSrc: 'mms.html' },
        'Bounty': { gameSrc: 'bounty.html' },
        'Mars':   { gameSrc: 'mars.html' }
      }
    };

    const state = {
      model: null,
      webcam: null,
      predictCtx: null,
      demoMode: false,
      currentClass: 'Other',
      currentConfidence: 0,
      predictions: {},
      gameActive: false,
      triggerTimer: null,
      triggerClass: null,
      detectionRunning: false
    };

    const $ = (sel) => document.querySelector(sel);
    const els = {
      webcam: $('#webcam'),
      startScreen: $('#start-screen'),
      startBtn: $('#start-btn'),
      demoToggle: $('#demo-toggle'),
      loading: $('#loading'),
      loadingText: $('#loading-text'),
      scannerUi: $('#scanner-ui'),
      statusTitle: $('#status-title'),
      statusSubtitle: $('#status-subtitle'),
      demoPicker: $('#demo-picker'),
      gameOverlay: $('#game-overlay'),
      gameIframe: $('#game-iframe'),
      predictCanvas: $('#predict-canvas')
    };

    // ═══════════════════════════════════════════════════════════════
    // Camera & prediction (working logic — untouched)
    // ═══════════════════════════════════════════════════════════════

    function assertLibrariesLoaded() {
      if (typeof window.tf === 'undefined') {
        throw new Error('TensorFlow.js failed to load. Check your internet connection.');
      }
      if (typeof window.tmImage === 'undefined') {
        throw new Error('Teachable Machine image library failed to load. Check your internet connection.');
      }
      return { tf: window.tf, tmImage: window.tmImage };
    }

    async function startApp() {
      els.startScreen.classList.add('hidden');
      showLoading('Starting camera…');
      try {
        assertLibrariesLoaded();
        await initWebcam();
        await initModel();
        hideLoading();
        startDetection();
      } catch (err) {
        hideLoading();
        alert('Could not start: ' + err.message + '\n\nTry enabling Demo Mode to test without a camera/model.');
        els.startScreen.classList.remove('hidden');
      }
    }

    async function initWebcam() {
      const { tmImage } = assertLibrariesLoaded();
      state.webcam = new tmImage.Webcam(640, 480, false);
      await state.webcam.setup({ facingMode: 'environment' });
      await state.webcam.play();
      els.webcam.srcObject = state.webcam.webcam.srcObject;
      await els.webcam.play();
      state.predictCtx = els.predictCanvas.getContext('2d', { willReadFrequently: true });
    }

    function getPredictInput() {
      const video = state.webcam.webcam;
      state.predictCtx.drawImage(video, 0, 0, els.predictCanvas.width, els.predictCanvas.height);
      return els.predictCanvas;
    }

    async function initModel() {
      if (!CONFIG.MODEL_URL) {
        state.demoMode = true;
        els.demoPicker.classList.add('visible');
        els.demoToggle.textContent = 'Demo Mode: ON';
        return;
      }
      const { tmImage } = assertLibrariesLoaded();
      showLoading('Loading AI model…');
      const modelURL = CONFIG.MODEL_URL.endsWith('/') ? CONFIG.MODEL_URL : CONFIG.MODEL_URL + '/';
      state.model = await tmImage.load(modelURL + 'model.json', modelURL + 'metadata.json');
      console.log('Model loaded from:', modelURL);
    }

    function startDetection() {
      if (state.detectionRunning) return;
      state.detectionRunning = true;
      detectLoop();
    }

    function pauseDetection() {
      state.detectionRunning = false;
    }

    async function detectLoop() {
      if (!state.detectionRunning) return;
      if (!state.gameActive) {
        if (!state.demoMode && state.model && state.webcam) {
          const predictions = await state.model.predict(getPredictInput());
          console.log('Raw predictions:', predictions);
          updatePredictions(predictions);
        }
        processDetection();
      }
      setTimeout(detectLoop, CONFIG.DETECTION_INTERVAL_MS);
    }

    function updatePredictions(predictions) {
      const map = {};
      let topClass = 'Other';
      let topProb = 0;
      predictions.forEach(p => {
        map[p.className] = p.probability;
        if (p.probability > topProb) {
          topProb = p.probability;
          topClass = p.className;
        }
      });
      CONFIG.CLASSES.forEach(cls => { if (!(cls in map)) map[cls] = 0; });
      state.predictions = map;
      state.currentClass = topClass;
      state.currentConfidence = topProb;
    }

    // ═══════════════════════════════════════════════════════════════
    // Detection → 1s hold → instant iframe launch
    // ═══════════════════════════════════════════════════════════════

    function getMatchedCandy() {
      let matchedCandy = null;
      let matchedConfidence = 0;
      CONFIG.CANDY_CLASSES.forEach(cls => {
        const prob = state.predictions[cls] || 0;
        if (prob >= CONFIG.CONFIDENCE_THRESHOLD && prob > matchedConfidence) {
          matchedCandy = cls;
          matchedConfidence = prob;
        }
      });
      return { matchedCandy, matchedConfidence };
    }

    function resetScannerPrompt() {
      els.statusTitle.textContent = 'Point at a product';
      els.statusTitle.classList.remove('detected');
      els.statusSubtitle.textContent = 'Hold M&Ms, Bounty, or Mars in front of the camera to unlock a game';
    }

    function setDemoClass(className, confidence = 0.95) {
      CONFIG.CLASSES.forEach(cls => {
        state.predictions[cls] = cls === className ? confidence : 0.02;
      });
      state.currentClass = className;
      state.currentConfidence = confidence;
      processDetection();
    }

    function processDetection() {
      const { matchedCandy } = getMatchedCandy();
      const isTriggered = matchedCandy !== null;

      if (isTriggered) {
        els.statusTitle.textContent = matchedCandy + ' Detected!';
        els.statusTitle.classList.add('detected');
        els.statusSubtitle.textContent = 'Get ready — your game is loading…';
      } else {
        resetScannerPrompt();
      }

      if (isTriggered && !state.gameActive) {
        if (state.triggerClass !== matchedCandy) {
          clearTrigger();
          state.triggerClass = matchedCandy;
          state.triggerTimer = setTimeout(() => launchGame(matchedCandy), CONFIG.TRIGGER_HOLD_MS);
        }
      } else if (!state.gameActive) {
        clearTrigger();
      }
    }

    function clearTrigger() {
      if (state.triggerTimer) {
        clearTimeout(state.triggerTimer);
        state.triggerTimer = null;
      }
      state.triggerClass = null;
    }

    // ═══════════════════════════════════════════════════════════════
    // Game launch & reset (iframe overlay — instant)
    // ═══════════════════════════════════════════════════════════════

    function launchGame(className) {
      const brand = CONFIG.BRAND_INFO[className];
      if (!brand || !brand.gameSrc) return;

      clearTrigger();
      state.gameActive = true;
      pauseDetection();

      els.scannerUi.classList.add('hidden');
      els.demoPicker.classList.remove('visible');

      els.gameIframe.src = brand.gameSrc;
      els.gameOverlay.classList.add('active');
    }

    function returnToScanner() {
      els.gameOverlay.classList.remove('active');
      els.gameIframe.src = '';
      state.gameActive = false;
      state.triggerClass = null;
      clearTrigger();

      els.scannerUi.classList.remove('hidden');
      resetScannerPrompt();
      if (state.demoMode) els.demoPicker.classList.add('visible');

      startDetection();
    }

    window.addEventListener('message', function (event) {
      if (event.data && event.data.action === 'resetGame') {
        returnToScanner();
      }
    });

    // ═══════════════════════════════════════════════════════════════
    // UI helpers
    // ═══════════════════════════════════════════════════════════════

    function showLoading(text) {
      els.loadingText.textContent = text;
      els.loading.classList.add('visible');
    }

    function hideLoading() {
      els.loading.classList.remove('visible');
    }

    // ═══════════════════════════════════════════════════════════════
    // Event wiring
    // ═══════════════════════════════════════════════════════════════

    els.startBtn.addEventListener('click', startApp);

    els.demoToggle.addEventListener('click', () => {
      state.demoMode = !state.demoMode;
      els.demoToggle.textContent = state.demoMode ? 'Demo Mode: ON' : 'Enable Demo Mode';
      if (state.demoMode) {
        els.demoPicker.classList.add('visible');
        setDemoClass('Other', 0.5);
      } else {
        els.demoPicker.classList.remove('visible');
      }
    });

    els.demoPicker.querySelectorAll('.demo-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (!state.demoMode) return;
        setDemoClass(btn.dataset.class, 0.95);
      });
    });

    document.body.addEventListener('touchmove', (e) => {
      if (state.gameActive) e.preventDefault();
    }, { passive: false });

    CONFIG.CLASSES.forEach(cls => { state.predictions[cls] = 0; });
    state.predictions['Other'] = 1;

    try {
      assertLibrariesLoaded();
      els.startBtn.textContent = 'Start Camera';
    } catch (err) {
      console.error(err);
      els.startBtn.disabled = true;
      els.startBtn.textContent = 'Libraries failed to load';
      alert('Could not load required libraries.\n\n' + err.message);
    }
  </script>
</body>
</html>
