<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Catch 'Em All</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#7c6cf0;      /* lavender */
    --sky-mid:#ff9ec4;      /* cotton candy pink */
    --sky-low:#ffd9a8;      /* warm peach */
    --ink:#2a2350;          /* deep grape ink */
    --cream:#fff7ee;
    --danger:#ff3b5c;
    --shadow:rgba(42,35,80,.28);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;background:#1b1430;}
  body{
    display:flex;align-items:center;justify-content:center;
    font-family:'Fredoka',system-ui,-apple-system,'Segoe UI',sans-serif;
    color:var(--ink);
  }
  #stage{
    position:relative;
    width:min(100vw,460px);
    height:100vh;height:100dvh;
    max-height:920px;
    overflow:hidden;
    box-shadow:0 0 60px rgba(0,0,0,.5);
    background:linear-gradient(180deg,#241a52 0%,#5b3a8f 32%,#ff8d63 66%,#ffd49e 100%);
    touch-action:none;
    user-select:none;
  }
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}

  /* ---- HUD ---- */
  #hud{
    position:absolute;top:0;left:0;right:0;
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 18px 0;z-index:5;pointer-events:none;
  }
  #hearts{display:flex;gap:6px;font-size:24px;line-height:1;filter:drop-shadow(0 2px 2px var(--shadow));}
  #hearts .h{transition:transform .25s ease, opacity .25s ease;}
  #hearts .h.lost{opacity:.22;transform:scale(.7) translateY(2px);}
  #scoreWrap{
    background:var(--cream);
    border-radius:999px;padding:7px 16px 6px;
    box-shadow:0 4px 0 var(--shadow);
    display:flex;align-items:baseline;gap:6px;
  }
  #scoreWrap .lbl{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;opacity:.55;}
  #score{font-size:22px;font-weight:700;min-width:1.4ch;text-align:right;}
  #mute{
    pointer-events:auto;cursor:pointer;
    width:38px;height:38px;border-radius:50%;border:none;
    background:var(--cream);box-shadow:0 4px 0 var(--shadow);
    font-size:17px;display:grid;place-items:center;color:var(--ink);
  }
  #mute:active{transform:translateY(2px);box-shadow:0 2px 0 var(--shadow);}

  /* ---- overlays ---- */
  .overlay{
    position:absolute;inset:0;z-index:20;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:32px;gap:14px;
    background:radial-gradient(120% 90% at 50% 35%,rgba(124,108,240,.30),rgba(27,20,48,.78));
    backdrop-filter:blur(3px);
  }
  .overlay.hidden{display:none;}
  .brand-logo{
    max-width:64%;max-height:128px;width:auto;height:auto;
    margin-bottom:2px;object-fit:contain;
    filter:drop-shadow(0 6px 12px rgba(0,0,0,.32));
  }
  .brand-logo.hidden{display:none;}
  .title{
    font-size:clamp(40px,13vw,62px);font-weight:700;color:var(--cream);
    line-height:.95;letter-spacing:-.01em;
    text-shadow:0 5px 0 rgba(0,0,0,.18);
  }
  .title .pop{display:block;color:#ffe27a;font-size:.62em;letter-spacing:.02em;}
  .sub{color:#fff;opacity:.92;font-size:15px;font-weight:500;max-width:18em;line-height:1.5;}
  .legend{display:flex;gap:18px;margin-top:4px;color:#fff;font-size:13px;font-weight:500;opacity:.95;}
  .legend div{display:flex;flex-direction:column;align-items:center;gap:5px;}
  .legend .ico{font-size:24px;}
  .btn{
    margin-top:10px;cursor:pointer;border:none;
    font-family:inherit;font-weight:700;font-size:20px;color:var(--ink);
    background:#ffe27a;padding:15px 40px;border-radius:999px;
    box-shadow:0 6px 0 #c9a72e;transition:transform .08s, box-shadow .08s;
  }
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c9a72e;}
  #finalScore{font-size:clamp(56px,20vw,88px);font-weight:700;color:#ffe27a;line-height:1;text-shadow:0 5px 0 rgba(0,0,0,.2);}
  #overReason{color:#fff;font-weight:600;font-size:16px;opacity:.95;}
  #best{color:#fff;opacity:.75;font-size:13px;font-weight:500;}
  .countdown{font-size:120px;font-weight:700;color:var(--cream);text-shadow:0 6px 0 rgba(0,0,0,.2);}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>

  <div id="hud">
    <div id="hearts"></div>
    <div id="scoreWrap"><span class="lbl">Score</span><span id="score">0</span></div>
    <button id="mute" aria-label="Toggle sound">🔊</button>
  </div>

  <!-- Start -->
  <div class="overlay" id="startScreen">
    <img id="brandLogo" class="brand-logo hidden" alt="Brand logo">
    <div class="title">Catch<span class="pop">'Em All!</span></div>
    <p class="sub">Cup your gloves under the falling M&amp;M's. Tap <b>left</b>, <b>middle</b> or <b>right</b> to move.</p>
    <div class="legend">
      <div><span class="ico">🍬</span>Catch M&amp;M's</div>
      <div><span class="ico">💣</span>Dodge bombs</div>
      <div><span class="ico">❤️</span>3 misses out</div>
    </div>
    <button class="btn" id="startBtn">Play</button>
  </div>

  <!-- Game over -->
  <div class="overlay hidden" id="overScreen">
    <div id="overReason">Game over</div>
    <div id="finalScore">0</div>
    <div id="best"></div>
    <button class="btn" id="againBtn">Play again</button>
  </div>
</div>

// ---------- sizing ----------
let W=0,H=0,DPR=1;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2.5);
  W = stage.clientWidth; H = stage.clientHeight;
  canvas.width = Math.round(W*DPR);
  canvas.height= Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);
resize();

// ---------- Burj Khalifa dusk scenery (drawn) ----------
let scenery=null;
window.addEventListener('resize', ()=>{ scenery=null; });
function buildScenery(){
  const gy=H*0.875;                 // skyline ground line
  const cx=W*0.5;
  const burjH=H*0.74;               // total height of Burj incl. spire
  const bw=W*0.050;                 // base half-width
  const bodyH=burjH*0.78, needleH=burjH*0.22;
  // stepped setback profile (halfWidth fraction of bw, height fraction of bodyH)
  const prof=[[1,0],[1,.16],[.80,.16],[.80,.36],[.60,.36],[.60,.56],
              [.42,.56],[.42,.74],[.24,.74],[.24,1]];
  // background + foreground towers as [xFrac, wFrac, hFrac]
  const back=[[.07,.10,.20],[.17,.07,.30],[.29,.10,.22],[.39,.06,.16],
              [.61,.08,.32],[.71,.11,.24],[.82,.07,.36],[.92,.09,.27]];
  const front=[[.11,.13,.30],[.23,.09,.21],[.78,.12,.34],[.90,.10,.25]];
  // window lights up the Burj
  const lights=[];
  for(let i=0;i<13;i++){ const f=0.06+i*0.06; lights.push([cx, gy-bodyH*f]); }
  scenery={gy,cx,burjH,bw,bodyH,needleH,prof,back,front,lights};
}

function drawScenery(t){
  if(!scenery) buildScenery();
  const s=scenery, gy=s.gy;

  // warm horizon haze + sun glow
  let sun=ctx.createRadialGradient(W*0.5,gy,W*0.04,W*0.5,gy,W*0.85);
  sun.addColorStop(0,'rgba(255,209,150,.55)');
  sun.addColorStop(0.4,'rgba(255,150,95,.20)');
  sun.addColorStop(1,'rgba(255,150,95,0)');
  ctx.fillStyle=sun; ctx.fillRect(0,gy-H*0.5,W,H*0.7);

  // back towers (hazy, distant)
  ctx.fillStyle='rgba(91,74,140,.55)';
  for(const b of s.back){
    const w=b[1]*W, x=b[0]*W-w/2, h=b[2]*H;
    ctx.fillRect(x,gy-h,w,h);
  }

  // Burj Khalifa silhouette
  ctx.fillStyle='#322657';
  ctx.beginPath();
  // left edge up
  for(const p of s.prof){ ctx.lineTo(s.cx-p[0]*s.bw, gy-p[1]*s.bodyH); }
  ctx.lineTo(s.cx, gy-s.bodyH-s.needleH);          // spire tip
  // right edge down
  for(let i=s.prof.length-1;i>=0;i--){ const p=s.prof[i]; ctx.lineTo(s.cx+p[0]*s.bw, gy-p[1]*s.bodyH); }
  ctx.closePath(); ctx.fill();
  // sunset rim light on right edge
  ctx.strokeStyle='rgba(255,170,120,.45)'; ctx.lineWidth=Math.max(1,W*0.004);
  ctx.beginPath();
  for(let i=0;i<s.prof.length;i++){ const p=s.prof[i]; ctx.lineTo(s.cx+p[0]*s.bw, gy-p[1]*s.bodyH); }
  ctx.lineTo(s.cx, gy-s.bodyH-s.needleH); ctx.stroke();

  // front towers (darker, nearer)
  ctx.fillStyle='#281d4a';
  for(const b of s.front){
    const w=b[1]*W, x=b[0]*W-w/2, h=b[2]*H;
    ctx.fillRect(x,gy-h,w,h);
  }

  // twinkling window lights up the Burj
  for(let i=0;i<s.lights.length;i++){
    const l=s.lights[i];
    const tw=0.5+0.5*Math.sin(t*2+i*1.3);
    ctx.globalAlpha=0.35+0.45*tw;
    ctx.fillStyle='#ffd98a';
    ctx.fillRect(l[0]-W*0.004, l[1], W*0.008, H*0.006);
  }
  ctx.globalAlpha=1;
}

// ---------- lanes ----------
const LANES = 3;
function laneX(i){ return W*(i+0.5)/LANES; }
const CANDY_COLORS = ['#e8473f','#ffcf33','#3aa564','#3f7ad1','#ff8a2b','#7a4a2b'];

// ---------- state ----------
let state='start';            // start | count | play | over
let items=[], particles=[], pops=[];
let gloveLane=1, gloveAnim=1;  // smooth interpolated lane position
let squash=0;                  // glove catch squash 0..1
let score=0, hearts=3;
let elapsed=0, spawnTimer=0;
let shake=0, flash=0;
let best = 0;
let countVal=3, countTimer=0;

// ---------- audio (tiny synth, no assets) ----------
let actx=null, muted=false;
function audioInit(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(actx&&actx.state==='suspended') actx.resume(); }
function blip(freq,dur,type,vol){
  if(!actx||muted) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type||'sine'; o.frequency.value=freq;
  g.gain.value=vol||0.18;
  o.connect(g); g.connect(actx.destination);
  const t=actx.currentTime;
  g.gain.setValueAtTime(g.gain.value,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.start(t); o.stop(t+dur);
}
function sndCatch(){ blip(660,0.10,'triangle',0.16); setTimeout(()=>blip(880,0.10,'triangle',0.14),55); }
function sndMiss(){ blip(150,0.18,'sine',0.20); }
function sndBomb(){
  if(!actx||muted) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type='sawtooth'; o.frequency.setValueAtTime(220,actx.currentTime);
  o.frequency.exponentialRampToValueAtTime(40,actx.currentTime+0.4);
  g.gain.value=0.28; o.connect(g); g.connect(actx.destination);
  g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+0.45);
  o.start(); o.stop(actx.currentTime+0.45);
}
muteBtn.addEventListener('click', ()=>{ muted=!muted; muteBtn.textContent=muted?'🔇':'🔊'; });

// ---------- controls ----------
function moveTo(lane){ if(state==='play'){ gloveLane=Math.max(0,Math.min(LANES-1,lane)); } }
stage.addEventListener('pointerdown', (e)=>{
  if(state!=='play') return;
  const rect=stage.getBoundingClientRect();
  const x=e.clientX-rect.left;
  moveTo(Math.floor(x/(W/LANES)));
});
window.addEventListener('keydown',(e)=>{
  if(state==='play'){
    if(e.key==='ArrowLeft'||e.key==='a') moveTo(gloveLane-1);
    if(e.key==='ArrowRight'||e.key==='d') moveTo(gloveLane+1);
    if(e.key==='1') moveTo(0); if(e.key==='2') moveTo(1); if(e.key==='3') moveTo(2);
  }
  if((state==='start'||state==='over')&&(e.key===' '||e.key==='Enter')) beginCountdown();
});

// ---------- flow ----------
function beginCountdown(){
  audioInit();
  score=0; hearts=3; elapsed=0; spawnTimer=0;
  items=[]; particles=[]; pops=[];
  gloveLane=1; gloveAnim=1; squash=0; shake=0; flash=0;
  renderHearts(); scoreEl.textContent='0';
  startScreen.classList.add('hidden');
  overScreen.classList.add('hidden');
  countVal=3; countTimer=0; state='count';
}
function startPlay(){ state='play'; }
function gameOver(reason){
  state='over';
  best=Math.max(best,score);
  finalScore.textContent=score;
  overReason.textContent=reason;
  bestEl.textContent='Best this session: '+best;
  overScreen.classList.remove('hidden');
}

function renderHearts(){
  heartsEl.innerHTML='';
  for(let i=0;i<3;i++){
    const s=document.createElement('span');
    s.className='h'+(i>=hearts?' lost':''); s.textContent='❤️';
    heartsEl.appendChild(s);
  }
}

// ---------- difficulty ----------
function fallSpeed(){ return Math.min(0.95, 0.30 + elapsed*0.013) * H; }   // px/sec
function spawnInterval(){ return Math.max(0.40, 0.95 - elapsed*0.022); }    // sec
function bombChance(){ return Math.min(0.26, 0.11 + elapsed*0.0028); }

function spawn(){
  const isBomb = Math.random() < bombChance();
  items.push({
    lane: Math.floor(Math.random()*LANES),
    y: -H*0.06,
    bomb: isBomb,
    color: CANDY_COLORS[(Math.random()*CANDY_COLORS.length)|0],
    r: H*0.032,
    wobble: Math.random()*Math.PI*2,
    resolved:false
  });
}

// ---------- update ----------
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(state==='count'){
    countTimer-=dt;
    if(countTimer<=0){ countVal--; countTimer=0.7; if(countVal<0) startPlay(); }
  }
  if(state==='play') update(dt);
  // ease decay effects always
  squash += (0 - squash)*Math.min(1,dt*9);
  gloveAnim += (gloveLane - gloveAnim)*Math.min(1,dt*16);
  shake *= Math.pow(0.0001,dt);
  flash = Math.max(0, flash - dt*2.4);
  draw();
  requestAnimationFrame(loop);
}

function update(dt){
  elapsed+=dt;
  spawnTimer-=dt;
  if(spawnTimer<=0){ spawn(); spawnTimer=spawnInterval()*(0.8+Math.random()*0.4); }

  const sp=fallSpeed();
  const bandTop=H*0.80, bandBot=H*0.90;

  for(const it of items){
    it.y += sp*dt;
    it.wobble += dt*4;
    if(it.resolved) continue;

    // catch window
    if(it.y>=bandTop && it.y<=bandBot && it.lane===gloveLane){
      it.resolved=true;
      if(it.bomb){
        sndBomb(); burst(laneX(it.lane),bandTop,'#222',26,true);
        shake=18; flash=1;
        renderHearts();
        return gameOver('You caught a bomb! 💥');
      } else {
        score++; scoreEl.textContent=score;
        squash=1; sndCatch();
        burst(laneX(it.lane),bandTop,it.color,12,false);
        pops.push({x:laneX(it.lane),y:bandTop,life:1});
      }
    }
    // passed the band uncaught
    else if(it.y>bandBot){
      it.resolved=true;
      if(!it.bomb){
        hearts--; renderHearts(); sndMiss(); flash=0.5;
        if(hearts<=0){ return gameOver('Out of hearts! 💔'); }
      }
    }
  }
  items=items.filter(it=> !(it.resolved) ? true : it.y < H+H*0.1 );
  items=items.filter(it=> it.y < H+H*0.12);

  // particles & pops
  for(const p of particles){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=H*1.4*dt; p.life-=dt*1.6; }
  particles=particles.filter(p=>p.life>0);
  for(const p of pops){ p.y-=H*0.06*dt; p.life-=dt*1.5; }
  pops=pops.filter(p=>p.life>0);
}

function burst(x,y,color,n,big){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=(big?1:0.6)*H*(0.25+Math.random()*0.5);
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-H*0.2,
      life:0.6+Math.random()*0.4, r:(big?5:3)+Math.random()*4,
      color: big? (Math.random()<0.4?'#ff7a2b':'#444') : color});
  }
}

// ---------- draw ----------
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(shake>0.4){ ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake); }

  drawScenery(performance.now()/1000);
  drawClouds();

  // falling items
  for(const it of items){
    const wob=Math.sin(it.wobble)*W*0.012;
    if(it.bomb) drawBomb(laneX(it.lane)+wob, it.y, it.r);
    else drawCandy(laneX(it.lane)+wob, it.y, it.r, it.color);
  }

  // particles
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;

  // score pops
  ctx.textAlign='center'; ctx.font='700 '+(H*0.04)+"px Fredoka, sans-serif";
  for(const p of pops){
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle='#fff'; ctx.fillText('+1',p.x,p.y-H*0.05);
  }
  ctx.globalAlpha=1;

  drawGloves();
  ctx.restore();

  // hit flash
  if(flash>0){
    ctx.fillStyle='rgba(255,59,92,'+(flash*0.4)+')';
    ctx.fillRect(0,0,W,H);
  }

  // countdown overlay
  if(state==='count'){
    ctx.fillStyle='rgba(27,20,48,.35)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff7ee'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font='700 '+(H*0.16)+"px Fredoka, sans-serif";
    const t=countVal>0?countVal:'GO!';
    const sc=1+ (0.7-countTimer)*0.3;
    ctx.save(); ctx.translate(W/2,H/2); ctx.scale(sc,sc);
    ctx.fillText(t,0,0); ctx.restore();
    ctx.textBaseline='alphabetic';
  }
}

function drawClouds(){
  ctx.fillStyle='rgba(255,255,255,.18)';
  const t=elapsed*8;
  const blobs=[[0.2,0.18,0.13],[0.78,0.12,0.10],[0.5,0.30,0.16],[0.15,0.46,0.09],[0.85,0.40,0.12]];
  for(const b of blobs){
    const cx=((b[0]*W + Math.sin(t*0.02+b[1]*9)*8)%(W+120))-60;
    cloud(cx, b[1]*H, b[2]*W);
  }
}
function cloud(x,y,r){
  ctx.beginPath();
  ctx.arc(x,y,r*0.6,0,Math.PI*2);
  ctx.arc(x+r*0.5,y+r*0.1,r*0.45,0,Math.PI*2);
  ctx.arc(x-r*0.5,y+r*0.1,r*0.4,0,Math.PI*2);
  ctx.arc(x+r*0.1,y+r*0.25,r*0.5,0,Math.PI*2);
  ctx.fill();
}

function drawCandy(x,y,r,color){
  ctx.save(); ctx.translate(x,y);
  ctx.scale(1.18,0.92); // lentil
  // shadow
  ctx.fillStyle='rgba(42,35,80,.18)';
  ctx.beginPath(); ctx.arc(0,r*0.18,r,0,Math.PI*2); ctx.fill();
  // body
  ctx.fillStyle=color;
  ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
  // rim shade
  const g=ctx.createRadialGradient(-r*0.3,-r*0.3,r*0.2,0,0,r);
  g.addColorStop(0,'rgba(255,255,255,.55)');
  g.addColorStop(0.5,'rgba(255,255,255,0)');
  g.addColorStop(1,'rgba(0,0,0,.18)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
  ctx.restore();
  // m
  ctx.fillStyle='rgba(255,255,255,.92)';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='700 '+(r*1.05)+"px Fredoka, sans-serif";
  ctx.fillText('m',x,y+r*0.04);
}

function drawBomb(x,y,r){
  ctx.save(); ctx.translate(x,y);
  // danger glow
  const gl=ctx.createRadialGradient(0,0,r*0.6,0,0,r*1.7);
  gl.addColorStop(0,'rgba(255,59,92,.35)'); gl.addColorStop(1,'rgba(255,59,92,0)');
  ctx.fillStyle=gl; ctx.beginPath(); ctx.arc(0,0,r*1.7,0,Math.PI*2); ctx.fill();
  // body
  ctx.fillStyle='#1d1d22';
  ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
  const g=ctx.createRadialGradient(-r*0.35,-r*0.4,r*0.1,0,0,r);
  g.addColorStop(0,'rgba(255,255,255,.55)'); g.addColorStop(0.4,'rgba(255,255,255,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
  // cap
  ctx.fillStyle='#5a5a66';
  ctx.fillRect(-r*0.22,-r*1.25,r*0.44,r*0.4);
  // fuse
  ctx.strokeStyle='#caa14a'; ctx.lineWidth=r*0.12; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(0,-r*1.2);
  ctx.quadraticCurveTo(r*0.5,-r*1.55,r*0.35,-r*1.85); ctx.stroke();
  // spark
  ctx.fillStyle=Math.sin(elapsed*30)>0?'#ffcf33':'#ff7a2b';
  ctx.beginPath(); ctx.arc(r*0.35,-r*1.9,r*0.18,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawGloves(){
  const cx=laneX(gloveAnim);
  const baseY=H*1.02;
  const gw=W/LANES*0.34;        // glove half-width
  const lift=squash*H*0.018;
  const spread=gw*1.05;
  drawGlove(cx-spread, baseY-lift, gw, +1, squash);
  drawGlove(cx+spread, baseY-lift, gw, -1, squash);
}
// tilt:+1 left hand, -1 right hand
function drawGlove(x,baseY,gw,tilt,sq){
  ctx.save();
  ctx.translate(x,baseY);
  ctx.rotate(tilt*0.20);
  const h=gw*2.6;
  const squashY=1-sq*0.12, squashX=1+sq*0.10;
  ctx.scale(squashX,squashY);

  // shadow
  ctx.fillStyle='rgba(42,35,80,.22)';
  rounded(-gw*1.02, -h*0.62+6, gw*2.04, h*0.7, gw*0.8); ctx.fill();

  // cuff
  ctx.fillStyle='#6c5ce7';
  rounded(-gw*0.95, -h*0.18, gw*1.9, h*0.4, gw*0.4); ctx.fill();
  ctx.fillStyle='#f4d35e';
  ctx.fillRect(-gw*0.95, -h*0.20, gw*1.9, h*0.07);

  // palm / mitt (white glove)
  ctx.fillStyle='#ffffff';
  rounded(-gw, -h*0.64, gw*2, h*0.55, gw*0.7); ctx.fill();
  // thumb
  ctx.beginPath();
  ctx.ellipse(-gw*0.92, -h*0.34, gw*0.34, gw*0.5, -0.5, 0, Math.PI*2); ctx.fill();
  // finger seams
  ctx.strokeStyle='rgba(42,35,80,.16)'; ctx.lineWidth=Math.max(1.4,gw*0.05); ctx.lineCap='round';
  for(let i=-1;i<=1;i++){
    ctx.beginPath();
    ctx.moveTo(i*gw*0.42,-h*0.60);
    ctx.lineTo(i*gw*0.42,-h*0.30);
    ctx.stroke();
  }
  // soft top shadow inside the cup
  const g=ctx.createLinearGradient(0,-h*0.64,0,-h*0.2);
  g.addColorStop(0,'rgba(42,35,80,.10)'); g.addColorStop(1,'rgba(42,35,80,0)');
  ctx.fillStyle=g; rounded(-gw,-h*0.64,gw*2,h*0.5,gw*0.7); ctx.fill();
  ctx.restore();
}
function rounded(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

requestAnimationFrame(loop);
})();
</script>
</body>
